<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cardápio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Gerador de Cardápio</h1>
        <form id="upload-form" enctype="multipart/form-data">
            <label for="file-upload">Selecione o arquivo Excel:</label>
            <input type="file" id="file-upload" name="file" accept=".xlsx" required>
            <button type="submit">Gerar Cardápio</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
